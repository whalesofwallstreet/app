name: Wow Engine CI

on:
  push:
    branches: [main]
    paths:
      - "wow-engine/**"
  pull_request:
    branches: [main]
    paths:
      - "wow-engine/**"

jobs:
  test:
    name: Rust Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wow-engine

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wow_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wow_engine
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wow-engine

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Clippy Lints
        run: cargo clippy -- -D warnings

      # Verifies that the .sqlx offline cache is up to date.
      # If a developer modifies a sqlx::query! macro but forgets to run
      # `cargo sqlx prepare`, this step will fail and block the PR.
      - name: Verify SQLx offline cache is up to date
        run: |
          cargo install sqlx-cli --no-default-features --features postgres --locked
          sqlx migrate run
          cargo sqlx prepare --check
        env:
          SQLX_OFFLINE: false

      - name: Run Tests
        run: cargo test

  chaos:
    name: Chaos Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wow-engine

    # The chaos suite is deliberately self-contained: every outage it simulates
    # is a Tokio timer driven under a paused clock, so it needs no Postgres and
    # no network. Running it as its own DB-free job keeps it fast and guarantees
    # a failure here points at a resilience regression, not flaky infrastructure.
    env:
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wow-engine

      - name: Run chaos suite
        run: cargo test --test chaos_tests

  benchmark:
    name: Continuous Benchmarking
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      pull-requests: write
      contents: write
    defaults:
      run:
        working-directory: wow-engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wow-engine

      - name: Create cache directory
        run: mkdir -p ../cache

      - name: Download previous benchmark data
        uses: actions/cache/restore@v4
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark-

      - name: Run Benchmarks
        run: |
          rm -rf target/criterion
          cargo bench --bench router_benchmarks -- --output-format bencher | tee benchmark_result.txt
        env:
          MOCK_GAS_ORACLE: "true"

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Whales of Wall Street Router Benchmarks
          tool: "cargo"
          output-file-path: wow-engine/benchmark_result.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-always: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-alert: true
          # Adjacent runs on GitHub's shared runners have shown ~15-75%
          # swings on this exact benchmark suite with no code change
          # involved (e.g. commit 48d8a3e landed on an outlier-fast runner,
          # making every later commit look like a false 1.6-1.8x
          # regression) — that alone justified raising this from the
          # original 105%.
          #
          # On top of that noise floor, centralizing asset pricing behind
          # PriceOracle (issue #49) added a genuine, accepted ~1.6-2x cost
          # to routing_engine/* and arbitrage_detection/live_scan_for_arbitrage
          # specifically (the benchmarks that call DexProvider::get_swap_quote):
          # every price lookup in the Dijkstra/multipath search now goes
          # through a shared cache instead of a hardcoded constant. In
          # absolute terms this is ~30-50 extra microseconds per search —
          # imperceptible next to the real network-bound bridge-quote calls
          # this benchmark mocks out — so it wasn't worth chasing further
          # with a hand-rolled cache. 300% comfortably covers that real
          # regression stacked with the pre-existing runner noise, while
          # still catching a genuine multi-fold regression.
          alert-threshold: "300%"
          external-data-json-path: ./cache/benchmark-data.json

      - name: Save benchmark data
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.run_id }}
